<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Vibrant Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Flow Line Gradient -->
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.2" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #ffffff;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .metric-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 11px;
        fill: #64748b;
        letter-spacing: 0.5px;
      }
      .metric-val {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #38bdf8;
      }
      /* Subtle Floating Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.85; }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-item-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-item-2 {
        animation: floatSlow 7s ease-in-out infinite 1s;
      }
      .floating-item-3 {
        animation: floatSlow 5.5s ease-in-out infinite 2s;
      }
      .pulsing-orb {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      .flow-path {
        stroke-dasharray: 12, 8;
        animation: dashMove 15s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Ambient Glowing Orbs in Background -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="1020" cy="180" r="160" fill="#818cf8" opacity="0.1" filter="url(#glow)" class="pulsing-orb" />
  <circle cx="650" cy="300" r="130" fill="#c084fc" opacity="0.08" filter="url(#glow)" class="pulsing-orb" />

  <!-- Dynamic Connecting Streamlines Behind Content -->
  <path d="M 60,300 C 350,330 450,220 750,250 C 950,270 1080,210 1140,230" fill="none" stroke="url(#flowGrad)" stroke-width="2.5" class="flow-path" />
  <path d="M 80,70 C 400,30 650,150 900,90 C 1050,50 1120,110 1160,80" fill="none" stroke="url(#flowGrad)" stroke-width="1.5" opacity="0.4" class="flow-path" />

  <!-- Foreground Title and Subtitle Block (Guaranteed Front and Center) -->
  <g transform="translate(600, 110)" text-anchor="middle">
    <!-- Category Badge -->
    <rect x="-170" y="-72" width="340" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.7" />
    <text x="0" y="-54" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1.2">
      ⚡ ENTERPRISE QUOTE-TO-CASH &amp; CLM
    </text>

    <!-- Main Title -->
    <text x="0" y="-4" class="title-text">
      Awesome Sell-Side &amp; Revenue Contract Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="32" class="subtitle-text">
      Curated Landscape of Commercial SaaS &amp; Open-Source Solutions for CPQ, CLM &amp; Billing
    </text>
  </g>

  <!-- Interactive / Dynamic Foreground Elements (Positioned Lower, Non-overlapping) -->

  <!-- Card 1: CPQ Engine (Left) -->
  <g class="floating-item-1" transform="translate(100, 210)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="35" cy="42" r="18" fill="#0284c7" fill-opacity="0.2" />
    <text x="35" y="48" font-size="20" text-anchor="middle">⚙️</text>
    <text x="68" y="38" class="pill-text">CPQ &amp; Quoting</text>
    <text x="68" y="58" class="metric-title">COMPLEX PRICING &amp; BOMS</text>
    <circle cx="190" cy="22" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Card 2: Contract Lifecycle Management (Center-Left) -->
  <g class="floating-item-2" transform="translate(360, 210)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="35" cy="42" r="18" fill="#6366f1" fill-opacity="0.2" />
    <text x="35" y="48" font-size="20" text-anchor="middle">📝</text>
    <text x="68" y="38" class="pill-text">AI-Native CLM</text>
    <text x="68" y="58" class="metric-title">REDLINE &amp; OBLIGATIONS</text>
    <circle cx="190" cy="22" r="4" fill="#818cf8">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Card 3: Billing & Rev Rec (Center-Right) -->
  <g class="floating-item-3" transform="translate(620, 210)">
    <rect width="210" height="85" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="35" cy="42" r="18" fill="#9333ea" fill-opacity="0.2" />
    <text x="35" y="48" font-size="20" text-anchor="middle">💳</text>
    <text x="68" y="38" class="pill-text">Billing &amp; Invoicing</text>
    <text x="68" y="58" class="metric-title">USAGE-BASED &amp; HYBRID</text>
    <circle cx="190" cy="22" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Card 4: ASC 606 & Compliance (Right) -->
  <g class="floating-item-1" transform="translate(880, 210)">
    <rect width="220" height="85" rx="12" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="35" cy="42" r="18" fill="#059669" fill-opacity="0.2" />
    <text x="35" y="48" font-size="20" text-anchor="middle">⚖️</text>
    <text x="68" y="38" class="pill-text">ASC 606 &amp; IFRS 15</text>
    <text x="68" y="58" class="metric-title">AUDIT &amp; REV RECOGNITION</text>
    <circle cx="200" cy="22" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
